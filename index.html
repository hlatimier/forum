<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Forum JDR (FR/EN commented)</title>

<style>
/* ========================= */
/* STYLE GLOBAL / GLOBAL STYLE */
/* ========================= */
body{
font-family:Arial, sans-serif;
background:#1e1e2f;
color:#fff;
margin:0;
}

header{
background:#2c2c44;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:20px auto;
}

.card{
background:#2c2c44;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-sizing:border-box;
}

input,textarea,select{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:5px;
box-sizing:border-box;
}

button{
padding:8px 10px;
background:#6a5acd;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
margin-top:5px;
}

button:hover{background:#836fff}

.hidden{display:none}

.topbar{display:block}
.topbar div,.topbar button{display:inline-block;vertical-align:middle}

.msg{margin-top:10px;padding-left:10px;border-left:2px solid #555}

.actions button{margin-right:6px}
.actions button:last-child{margin-right:0}

.small{background:#444}
.small:hover{background:#666}

.pagination{text-align:center;margin-top:15px}

</style>
</head>

<body>

<header>
🎲 Forum du Club JDR
</header>

<div class="container">

<!-- ========================= -->
<!-- AUTH SECTION / CONNEXION -->
<!-- ========================= -->
<div id="auth" class="card">
<h2>Connexion / Inscription</h2>

<!-- FR: champs utilisateur -->
<!-- EN: user input fields -->
<input id="username" placeholder="Pseudo">
<input id="password" type="password" placeholder="Mot de passe">

<button onclick="register()">S'inscrire</button>
<button onclick="login()">Se connecter</button>

<p id="msg"></p>
</div>

<!-- ========================= -->
<!-- MAIN APP / APPLICATION -->
<!-- ========================= -->
<div id="app" class="hidden">

<div class="card topbar">
<div>Utilisateur : <b id="currentUser"></b></div>
<button onclick="logout()">Déconnexion</button>
</div>

<!-- CREATE POST / CREER SUJET -->
<div class="card">
<h3>Nouveau sujet</h3>
<input id="title" placeholder="Titre">
<textarea id="content" placeholder="Message"></textarea>
<button onclick="addPost()">Publier</button>
</div>

<!-- SORT / TRI -->
<div class="card">
<h3>Tri des sujets</h3>
<select id="sortSelect" onchange="loadPosts()">
<option value="new">Plus récents</option>
<option value="old">Plus anciens</option>
</select>
</div>

<div id="posts"></div>

<div class="pagination">
<button onclick="prevPage()">⬅️</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">➡️</button>
</div>

</div>

</div>

<script>

/* ========================= */
/* CONFIG / CONFIGURATION */
/* ========================= */
var POSTS_PER_PAGE = 5;
var currentPage = 1;

/* ========================= */
/* USERS / UTILISATEURS */
/* =====================
